<!doctype html>
<html lang="en">
  <head>
    <!-- Character encoding and responsive layout -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- OFFSET Studio brand identity -->
    <title>OFFSET Studio® ~</title>
    <meta
      name="description"
      content="OFFSET Studio is an independent digital design studio creating bold websites and distinctive online experiences for ambitious brands."
    />
    <meta name="theme-color" content="#111111" />
    <meta name="color-scheme" content="dark" />

    <!-- Browser icon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />

    <!-- Search engine indexing preferences -->
    <meta name="robots" content="index, follow" />

    <!-- Open Graph: link previews on social platforms -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OFFSET Studio® — Distinct by Design" />
    <meta
      property="og:description"
      content="Bold digital experiences. Intentional design. No ordinary websites."
    />
    <meta property="og:site_name" content="OFFSET Studio" />

    <!-- Twitter/X link preview -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="OFFSET Studio® — Distinct by Design"
    />
    <meta
      name="twitter:description"
      content="An independent digital studio creating distinctive online experiences."
    />

    <!-- Vite entry point: keep this for the React application -->
    <script type="module" src="/src/main.jsx"></script>
  </head>

  <body>
    <!-- React mounts the complete OFFSET Studio website here -->
    <div id="root"></div>
  </body>
</html>
