
<!-- OFFSET Studio favicon: minimal signal-inspired O mark -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Midnight background -->
  <rect width="64" height="64" rx="14" fill="#111111"/>

  <!-- Bold geometric O -->
  <path
    d="M32 11
       A21 21 0 1 0 32 53
       A21 21 0 1 0 32 11
       Z
       M32 21
       A11 11 0 1 1 32 43
       A11 11 0 1 1 32 21 Z"
    fill="#F4F0E8"
    fill-rule="evenodd"
  />

  <!-- Signal-orange interruption -->
  <path
    d="M43 14 L54 14 L54 24 L43 24 Z"
    fill="#FF4D00"
  />

  <!-- Electric-cyan signal -->
  <path
    d="M43 14 L54 14"
    stroke="#00D9FF"
    stroke-width="3"
    stroke-linecap="square"
  />
</svg>